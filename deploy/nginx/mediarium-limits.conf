# 放进 /etc/nginx/conf.d/mediarium-limits.conf（http 段）
# 登录限速：只限 POST（开设备密钥），GET 不限
map $request_method $mediarium_login_key { POST $binary_remote_addr; default ""; }
limit_req_zone $mediarium_login_key zone=mediarium_login:1m rate=6r/m;
# 邀请注册限速
limit_req_zone $binary_remote_addr zone=mediarium_invite:1m rate=6r/m;
