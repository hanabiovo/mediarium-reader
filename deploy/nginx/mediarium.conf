# 放进 /etc/nginx/sites-available/mediarium，再软链到 sites-enabled。
# 把 reader.example.com 换成你的域名。先只写 80 端口，HTTPS 由 certbot --nginx 自动补上。
# 需要先放好 mediarium-limits.conf（限速用的 zone 在那里定义）。
server {
    listen 80;
    listen [::]:80;
    server_name reader.example.com;

    client_max_body_size 10m;   # 导入 OPML 用

    # 灵媒界面（web/ 构建出来的静态文件）
    root /var/www/mediarium;
    index index.html;

    # 登录：开设备密钥这一个地址限速；去掉 401 的 WWW-Authenticate，免得浏览器弹自己的登录框
    location = /miniflux/v1/api-keys {
        limit_req zone=mediarium_login burst=4 nodelay;
        limit_req_status 429;
        proxy_hide_header WWW-Authenticate;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Miniflux 后台与数据接口，路径原样转发（BASE_URL 已带 /miniflux/）
    location /miniflux/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # 翻译：流式返回，关缓冲；AI 慢，读超时 300 秒
    location /scribe/translate {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 512k;
    }

    # 邀请注册：限速，请求体最多 4k
    location /scribe/invite/ {
        limit_req zone=mediarium_invite burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 4k;
    }

    # 接入 AI 助手（MCP）：专属链接 /scribe/mcp/<随机串>。链接就是密钥，这段不记访问日志
    location ~ "^/scribe/mcp/[A-Za-z0-9_-]{32,128}$" {
        access_log off;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
    }

    # 不走 OAuth：客户端探测授权地址时直接回 404，别落到前端回退页回一个网页（405 会让客户端以为注册失败）
    location ^~ /.well-known/oauth- {
        return 404;
    }
    location = /register  { return 404; }
    location = /authorize { return 404; }
    location = /token     { return 404; }

    # 誊写服务的其余接口（图片中转、体检、灵媒自建等）
    location /scribe/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 1k;
    }

    # 打包后的静态资源，文件名带指纹，可以长期缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker 不缓存，保证更新及时生效
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 其余路径交给前端路由；入口页不缓存
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
